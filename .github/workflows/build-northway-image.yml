#
# Builds and publishes the Northway Hub Chatwoot Community Edition image to GHCR.
# Triggered manually (workflow_dispatch) or automatically on push to
# northway-custom-v4.12.1.
#

name: Build Northway Docker image

on:
  workflow_dispatch:
  push:
    branches:
      - northway-custom-v4.12.1

env:
  IMAGE_NAME: ghcr.io/northwaybrazil/chatwoot
  IMAGE_TAG: v4.12.1-northway.1

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Strip enterprise code
        run: |
          rm -rf enterprise
          rm -rf spec/enterprise

      - name: Set Chatwoot edition
        run: |
          echo -en '\nENV CW_EDITION="ce"' >> docker/Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
